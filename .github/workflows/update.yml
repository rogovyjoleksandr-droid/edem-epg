name: Update Edem EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Edem EPG
        run: |
          set -e

          URL="https://epg.one/edem.xml.gz"
          TMP="edem.xml.gz.new"

          echo "Downloading EPG..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 180 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o "$TMP"

          echo "Checking file..."

          if [ ! -s "$TMP" ]; then
            echo "ERROR: downloaded file is empty"
            exit 1
          fi

          if ! file "$TMP" | grep -qi gzip; then
            echo "ERROR: downloaded file is not gzip"
            file "$TMP"
            exit 1
          fi

          mv "$TMP" edem.xml.gz

          echo "EPG downloaded successfully"
          ls -lh edem.xml.gz

      - name: Check XML
        run: |
          set -e

          gzip -t edem.xml.gz

          gzip -dc edem.xml.gz | head -c 1000

          echo
          echo "XML/GZIP check OK"

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add edem.xml.gz

          if git diff --cached --quiet; then
            echo "EPG has not changed."
            exit 0
          fi

          git commit -m "Update Edem EPG"
          git push
